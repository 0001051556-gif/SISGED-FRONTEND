
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SESI SENAI - Liberação de Usuários</title>
  <link rel="stylesheet" href="../css/consultas.css" />
  <link rel="stylesheet" href="../css/instrutores.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI">
    </div>
    <div class="title">Sistema Acadêmico</div>
  </header>

  <main class="main-container">
    <div class="secao-atual-container">
      <div class="secao-btn">GERENCIAR LIBERAÇÃO DE USUÁRIOS</div>
    </div>

    
        <div class="alerta alerta-sucesso">
            
        </div>
    

    <section class="formulario-cadastro">
        <form method="POST" action="">
            <div class="form-grid">
                <div class="form-campo">
                    <label for="email_aluno">E-mail do Aluno:</label>
                    <input type="email" id="email_aluno" name="email_aluno" required>
                </div>
                <div class="form-campo">
                    <label for="email_responsavel">E-mail do Responsável:</label>
                    <input type="email" id="email_responsavel" name="email_responsavel" required>
                </div>
                <div class="form-campo">
                    <label for="status_liberacao">Tipo de Liberação:</label>
                    <select id="status_liberacao" name="status_liberacao" required>
                        <option value="">Selecione...</option>
                        <option value="oficial">Oficial (acesso total)</option>
                        <option value="oficial_1">Oficial 1 (Movimento, Consultas e Relatórios)</option>
                    </select>
                </div>
                <button type="submit" name="cadastrar" class="btn-cadastrar">LIBERAR</button>
            </div>
        </form>
    </section>

    <div style="flex: 1; width: 100%;">
        <table class="tabela-dados">
            <thead>
                <tr>
                    <th>Aluno Liberado</th>
                    <th>Responsável pela Liberação</th>
                    <th>Tipo</th>
                    <th>Horário da Liberação</th>
                </tr>
            </thead>
            <tbody>
                
                    
                        —
                        <tr>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                        </tr>
                    
                
                    <tr>
                        <td colspan="4" class="sem-dados">Nenhuma liberação registrada no histórico recente.</td>
                    </tr>
                
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
      <a href="utilitarios.html" class="voltar-btn">VOLTAR</a>
    </div>
  </main>
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body>
</html>
