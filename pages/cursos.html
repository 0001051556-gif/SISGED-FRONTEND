
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SESI SENAI - Cadastro de Cursos</title>
  <link rel="stylesheet" href="../css/consultas.css" />
  <link rel="stylesheet" href="../css/instrutores.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI">
    </div>
    <div class="title">Sistema Acadêmico</div>
  </header>

  <main class="main-container">
    <div class="secao-atual-container">
      <div class="secao-btn">GERENCIAR CURSOS</div>
    </div>

    
        <div class="alerta alerta-sucesso">
            
        </div>
    

    <section class="formulario-cadastro">
        <form method="POST" action="">
            <div class="form-grid">
                <div class="form-campo">
                    <label for="nome">Nome do Curso:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-campo">
                    <label for="id_modalidade">ID Modalidade:</label>
                    <input type="text" id="id_modalidade" name="id_modalidade" required>
                </div>
                <div class="form-campo">
                    <label for="id_area">ID Área:</label>
                    <input type="text" id="id_area" name="id_area" required>
                </div>
                <button type="submit" name="cadastrar" class="btn-cadastrar">CADASTRAR</button>
            </div>
        </form>
    </section>

    <div style="flex: 1; width: 100%;">
        <table class="tabela-dados">
            <thead>
                <tr>
                    <th>ID Curso</th>
                    <th>Nome do Curso</th>
                    <th>ID Modalidade</th>
                    <th>ID Área</th>
                </tr>
            </thead>
            <tbody>
                
                    
                        <tr>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                        </tr>
                    
                
                    <tr>
                        <td colspan="4" class="sem-dados">Nenhum curso cadastrado no sistema.</td>
                    </tr>
                
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
      <a href="cadastros.html" class="voltar-btn">VOLTAR</a>
    </div>
  </main>
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body>
</html>
