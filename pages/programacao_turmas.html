
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SESI SENAI - Programação de Turmas</title>
  <link rel="stylesheet" href="../css/consultas.css" />
  <link rel="stylesheet" href="../css/instrutores.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI">
    </div>
    <div class="title">Sistema Acadêmico</div>
  </header>

  <main class="main-container">
    <div class="secao-atual-container">
      <div class="secao-btn">PROGRAMAÇÃO DE TURMAS</div>
    </div>

    
        <div class="alerta alerta-sucesso">
            
        </div>
    

    <section class="formulario-cadastro">
        <form method="POST" action="">
            <div class="form-grid">
                <div class="form-campo">
                    <label for="turma_busca">Pesquisar Código / ID da Turma:</label>
                    <input type="text" id="turma_busca" name="turma_busca" value="" required>
                </div>
                <button type="submit" name="buscar_turma" class="btn-cadastrar">PESQUISAR</button>
            </div>
        </form>
    </section>

    <div style="flex: 1; width: 100%;">
        <table class="tabela-dados">
            <thead>
                <tr>
                    <th>ID Aula</th>
                    <th>Turma Pesquisada</th>
                    <th>ID Sala / Local</th>
                    <th>ID Instrutor</th>
                    <th>Data / Horário da Aula</th>
                </tr>
            </thead>
            <tbody>
                
                    
                        <tr>
                            <td>—</td>
                            <td><strong></strong></td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                        </tr>
                    
                
                    <tr>
                        <td colspan="5" class="sem-dados">
                            
                        </td>
                    </tr>
                
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
      <a href="movimento.html" class="voltar-btn">VOLTAR</a>
    </div>
  </main>
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body>
</html>
