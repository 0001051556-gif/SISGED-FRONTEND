
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SESI SENAI - Troca de Senha</title>
  <link rel="stylesheet" href="../css/consultas.css" />
  <link rel="stylesheet" href="../css/instrutores.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI">
    </div>
    <div class="title">Sistema Acadêmico</div>
  </header>

  <main class="main-container">
    <div class="secao-atual-container">
      <div class="secao-btn">ALTERAR SENHA DE ACESSO</div>
    </div>

    
        <div class="alerta alerta-sucesso">
            
        </div>
    

    
        <section class="formulario-cadastro">
            <form method="POST" action="">
                <div class="form-grid">
                    <div class="form-campo">
                        <label for="email_busca">Pesquisar E-mail da Conta:</label>
                        <input type="email" id="email_busca" name="email_busca" required>
                    </div>
                    <button type="submit" name="buscar_email" class="btn-cadastrar">PESQUISAR</button>
                </div>
            </form>
        </section>
    
        <section class="formulario-cadastro">
            <form method="POST" action="">
                <input type="hidden" name="email_confirmado" value="—">
                <div class="form-grid">
                    <div class="form-campo">
                        <label>E-mail Selecionado:</label>
                        <input type="text" value="—" disabled style="opacity: 0.8;">
                    </div>
                    <div class="form-campo">
                        <label for="senha_atual">Senha Atual:</label>
                        <input type="password" id="senha_atual" name="senha_atual" required>
                    </div>
                    <div class="form-campo">
                        <label for="nova_senha">Nova Senha:</label>
                        <input type="password" id="nova_senha" name="nova_senha" required>
                    </div>
                    <button type="submit" name="alterar_senha" class="btn-cadastrar">ALTERAR SENHA</button>
                </div>
            </form>
        </section>
    

    <div class="footer-actions">
      <a href="utilitarios.html" class="voltar-btn">VOLTAR</a>
    </div>
  </main>

  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>

<script src="../js/app.js"></script>
</body>
</html>
