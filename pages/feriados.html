
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SESI SENAI - Cadastro de Feriados</title>
  <link rel="stylesheet" href="../css/consultas.css" />
  <link rel="stylesheet" href="../css/instrutores.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI">
    </div>
    <div class="title">Sistema Acadêmico</div>
  </header>

  <main class="main-container">
    <div class="secao-atual-container">
      <div class="secao-btn">GERENCIAR FERIADOS</div>
    </div>

    
        <div class="alerta alerta-sucesso">
            
        </div>
    

    <section class="formulario-cadastro">
        <form method="POST" action="">
            <div class="form-grid">
                <div class="form-campo">
                    <label for="descricao">Descrição do Feriado:</label>
                    <input type="text" id="descricao" name="descricao" required>
                </div>
                <div class="form-campo">
                    <label for="data">Data do Feriado:</label>
                    <input type="date" id="data" name="data" required>
                </div>
                <button type="submit" name="cadastrar" class="btn-cadastrar">CADASTRAR</button>
            </div>
        </form>
    </section>

    <div style="flex: 1; width: 100%;">
        <table class="tabela-dados">
            <thead>
                <tr>
                    <th>ID Feriado</th>
                    <th>Descrição</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody>
                
                    
                        <tr>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                        </tr>
                    
                
                    <tr>
                        <td colspan="3" class="sem-dados">Nenhum feriado cadastrado no sistema.</td>
                    </tr>
                
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
      <a href="cadastros.html" class="voltar-btn">VOLTAR</a>
    </div>
  </main>
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body>
</html>
