
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SESI SENAI - Cadastro de Atividades</title>
  <link rel="stylesheet" href="../css/consultas.css" />
  <link rel="stylesheet" href="../css/instrutores.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI">
    </div>
    <div class="title">Sistema Acadêmico</div>
  </header>

  <main class="main-container">
    <div class="secao-atual-container">
      <div class="secao-btn">GERENCIAR ATIVIDADES</div>
    </div>

    
        <div class="alerta alerta-sucesso">
            
        </div>
    

    <section class="formulario-cadastro">
        <form method="POST" action="">
            
                <input type="hidden" name="id_atividade" value="—">
            
            <div class="form-grid">
                <div class="form-campo">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" required
                        value="CADASTRAR">
                </div>
                <div class="form-campo">
                    <label for="id_turma">ID Turma:</label>
                    <input type="text" id="id_turma" name="id_turma" required
                        value="—">
                </div>
                <div class="form-campo">
                    <label for="id_materia">ID Matéria:</label>
                    <input type="text" id="id_materia" name="id_materia" required
                        value="—">
                </div>
                <div class="form-campo">
                    <label for="data_entrega">Data de Entrega:</label>
                    <input type="date" id="data_entrega" name="data_entrega" required
                        value="CADASTRAR">
                </div>
                <div class="form-campo" style="min-width: 100%; margin-top: 10px;">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" name="descricao"
                        value="CADASTRAR">
                </div>
                <button type="submit" name="cadastrar" class="btn-cadastrar" style="margin-top: 15px;">
                    CADASTRAR
                </button>
                
                    <a href="" class="btn-cadastrar" style="margin-top: 15px; text-align:center; text-decoration:none; background:#999;">CANCELAR</a>
                
            </div>
        </form>
    </section>

    <div style="flex: 1; width: 100%;">
        <table class="tabela-dados">
            <thead>
                <tr>
                    <th>ID Atividade</th>
                    <th>ID Turma</th>
                    <th>ID Matéria</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Data Entrega</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                
                    
                        <tr>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>
                                <a href="?editar=—">Editar</a>
                            </td>
                        </tr>
                    
                
                    <tr>
                        <td colspan="7" class="sem-dados">Nenhuma atividade cadastrada no sistema.</td>
                    </tr>
                
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
      <a href="cadastros.html" class="voltar-btn">VOLTAR</a>
    </div>
  </main>
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body>
</html>
