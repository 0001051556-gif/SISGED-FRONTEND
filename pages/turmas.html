 
<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>SESI SENAI - Cadastro de Turmas</title> 
    <link rel="stylesheet" href="../css/consultas.css" /> 
    <link rel="stylesheet" href="../css/instrutores.css"> 
</head> 
<body> 
    <header class="header"> 
        <div class="logo-container"> 
            <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI"> 
        </div> 
        <div class="title">Sistema Acadêmico</div> 
    </header> 
    <main class="main-container"> 
        <div class="secao-atual-container"> 
            <div class="secao-btn">GERENCIAR TURMAS</div> 
        </div> 
        
         
            <div class="alerta alerta-sucesso"> 
                 
            </div> 
         
        
        <section class="formulario-cadastro"> 
            <form method="POST" action=""> 
                <div class="form-grid"> 
                    <div class="form-campo"> 
                        <label for="nome">Nome da Turma:</label> 
                        <input type="text" id="nome" name="nome" required> 
                    </div> 
                    <div class="form-campo"> 
                        <label for="id_curso">IDs/Codigos dos Cursos (separe por vírgula):</label> 
                        <input type="text" id="id_curso" name="id_curso" placeholder="Ex: ENGENHARIA, DESIGN, TI" required> 
                    </div> 
                    <button type="submit" name="cadastrar" class="btn-cadastrar">VINCULAR CURSOS</button> 
                </div> 
            </form> 
        </section> 
        
        <div style="flex: 1; width: 100%;"> 
            <table class="tabela-dados"> 
                <thead> 
                    <tr> 
                        <th>ID Turma</th> 
                        <th>Nome da Turma</th> 
                        <th>Cursos Onde Está Cadastrada</th> 
                    </tr> 
                </thead> 
                <tbody> 
                     
                         
                            <tr> 
                                <td>—</td> 
                                <td>—</td> 
                                <td>—</td> 
                            </tr> 
                         
                     
                        <tr> 
                            <td colspan="3" class="sem-dados">Nenhuma turma cadastrada no sistema.</td> 
                        </tr> 
                     
                </tbody> 
            </table> 
        </div> 
        <div class="footer-actions"> 
            <a href="cadastros.html" class="voltar-btn">VOLTAR</a> 
        </div> 
    </main> 
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body> 
</html>
