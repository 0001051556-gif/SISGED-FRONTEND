
<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>SESI SENAI - Calendário Acadêmico</title> 
    <link rel="stylesheet" href="../css/consultas.css" /> 
    <link rel="stylesheet" href="../css/instrutores.css"> 
</head> 
<body> 
    <header class="header"> 
        <div class="logo-container"> 
            <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI"> 
        </div> 
        <div class="title">Sistema Acadêmico</div> 
    </header> 
    <main class="main-container"> 
        <div class="secao-atual-container"> 
            <div class="secao-btn">SALA CALENDÁRIO</div> 
        </div> 
        
        <!-- Formulário de Pesquisa por Turma -->
        <section class="formulario-cadastro"> 
            <form method="POST" action=""> 
                <div class="form-grid"> 
                    <div class="form-campo"> 
                        <label for="id_turma">Pesquisar por Turma (ID ou Nome):</label> 
                        <input type="text" id="id_turma" name="id_turma" value="" required placeholder="Ex: 1 ou Turma A"> 
                    </div> 
                    <button type="submit" name="pesquisar" class="btn-cadastrar">PESQUISAR</button> 
                </div> 
            </form> 
        </section> 
        
        <!-- Bloco de Atividades da Turma -->
        <div style="flex: 1; width: 100%; margin-bottom: 30px;"> 
            <h3 style="color: #333; margin-bottom: 10px; font-family: sans-serif;">📅 Atividades da Turma</h3>
            <table class="tabela-dados"> 
                <thead> 
                    <tr> 
                        <th>Matéria</th> 
                        <th>Atividade / Evento</th> 
                        <th>Data de Entrega</th> 
                    </tr> 
                </thead> 
                <tbody> 
                     
                         
                            <tr> 
                                <td>—</td> 
                                <td>—</td> 
                                <td>01/10/2026</td> 
                            </tr> 
                         
                     
                        <tr> 
                            <td colspan="3" class="sem-dados" style="text-align: center; color: #777; padding: 20px; font-weight: bold;">
                                
                            </td> 
                        </tr> 
                     
                </tbody> 
            </table> 
        </div> 

        <!-- Bloco de Feriados Gerais -->
        <div style="flex: 1; width: 100%;"> 
            <h3 style="color: #333; margin-bottom: 10px; font-family: sans-serif;">🎉 Feriados Cadastrados (Gerais)</h3>
            <table class="tabela-dados"> 
                <thead> 
                    <tr> 
                        <th>Feriado</th> 
                        <th>Data</th> 
                    </tr> 
                </thead> 
                <tbody> 
                     
                         
                            <tr> 
                                <td>—</td> 
                                <td>01/10/2026</td> 
                            </tr> 
                         
                     
                        <tr> 
                            <td colspan="2" class="sem-dados">Nenhum feriado registrado no sistema.</td> 
                        </tr> 
                     
                </tbody> 
            </table> 
        </div> 

        <div class="footer-actions"> 
            <a href="consultas.html" class="voltar-btn">VOLTAR</a> 
        </div> 
    </main> 
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body> 
</html>
