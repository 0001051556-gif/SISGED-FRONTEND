
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SESI SENAI - Lançamento de Aulas</title>
  <link rel="stylesheet" href="../css/consultas.css" />
  <link rel="stylesheet" href="../css/instrutores.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img class="logo-img" src="../assets/senai.png" alt="Logotipo do SESI SENAI">
    </div>
    <div class="title">Sistema Acadêmico</div>
  </header>

  <main class="main-container">
    <div class="secao-atual-container">
      <div class="secao-btn">LANÇAMENTO DE AULAS</div>
    </div>

    
        <div class="alerta alerta-sucesso">
            
        </div>
    

    <section class="formulario-cadastro">
        <form method="POST" action="">
            <div class="form-grid">
                <div class="form-campo">
                    <label for="email_instrutor">E-mail do Instrutor:</label>
                    <input type="email" id="email_instrutor" name="email_instrutor" required>
                </div>
                <div class="form-campo">
                    <label for="modalidade">ID / Código da Matéria:</label>
                    <input type="text" id="modalidade" name="modalidade" required>
                </div>
                <div class="form-campo">
                    <label for="sala">ID / Nome da Sala:</label>
                    <input type="text" id="sala" name="sala" required>
                </div>
                <div class="form-campo">
                    <label for="turma">ID / Código da Turma:</label>
                    <input type="text" id="turma" name="turma" required>
                </div>

                <div class="form-campo">
                    <label for="data_aula">Data da Aula:</label>
                    <input type="date" id="data_aula" name="data_aula" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                </div>

                <div class="form-campo">
                    <label for="horario_aula">Horário da Aula:</label>
                    <input type="time" id="horario_aula" name="horario_aula" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                </div>

                <button type="submit" name="cadastrar" class="btn-cadastrar">LANÇAR</button>
            </div>
        </form>
    </section>

    <div style="flex: 1; width: 100%;">
        <table class="tabela-dados">
            <thead>
                <tr>
                    <th>ID Lançamento</th>
                    <th>Instrutor</th>
                    <th>Matéria/Modalidade</th>
                    <th>Sala</th>
                    <th>Turma</th>
                    <th>Data e Horário</th>
                </tr>
            </thead>
            <tbody>
                
                    
                        <tr>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                        </tr>
                    
                
                    <tr>
                        <td colspan="6" class="sem-dados">Nenhum lançamento de aula registrado no histórico.</td>
                    </tr>
                
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
      <a href="movimento.html" class="voltar-btn">VOLTAR</a>
    </div>
  </main>
  <script>
      if (localStorage.getItem('modoEscuro') === 'ativado') {
          document.body.classList.add('modo-escuro');
      }
  </script>
<script src="../js/app.js"></script>
</body>
</html>
